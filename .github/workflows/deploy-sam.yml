name: Deploy SAM Application

on:
  push:
    branches:
      - main
      - deploy
  pull_request:
    branches:
      - main
      - deploy
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  SAM_STACK_NAME: python-test
  PYTHON_VERSION: "3.12"

# Required for OIDC authentication
permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Only deploy on push to main, not on PRs
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: https://github.com/${{ github.repository }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-SAM-Deploy

      - name: SAM Build
        run: sam build --use-container

      - name: SAM Deploy
        run: |
          sam deploy \
            --stack-name ${{ env.SAM_STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --s3-prefix ${{ env.SAM_STACK_NAME }} \
            --no-progressbar \
            --parameter-overrides AllowedIpAddress=${{ secrets.ALLOWED_IP_ADDRESS || '0.0.0.0/0' }} > /dev/null
          echo "✅ Deployment completed successfully"
